name: Build and publish site image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push site image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/kowloon-network/kowloon-network:latest

      - name: Build and push waitlist image
        uses: docker/build-push-action@v6
        with:
          context: ./waitlist
          push: true
          tags: ghcr.io/kowloon-network/kowloon-network-waitlist:latest
